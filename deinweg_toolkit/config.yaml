# Dein Weg Toolkit als lokales Home-Assistant-Add-on.
#
# Wichtig: hier steht KEIN "image:"-Schluessel. Genau daran erkennt der
# Supervisor, dass er das Add-on aus dem danebenliegenden Dockerfile selbst
# bauen soll, statt eine fertige Abbildung aus dem Netz zu holen.
#
# Diese Datei ist zugleich das, woran Home Assistant ein Update erkennt:
# steigt "version", bietet der Store die neue Fassung an. Sie muss also
# bei jeder Auslieferung mit main.py VERSION uebereinstimmen.
name: Dein Weg Toolkit
version: "1.16"
slug: deinweg_toolkit
description: >-
  Betreuungszeiten, Verwaltungsvorgaenge, Fuhrpark und Wiki
  fuer das ambulant betreute Wohnen
stage: stable

arch:
  - aarch64
  - amd64

# Das Abbild bringt kein eigenes Init-System mit (python:3.12-slim), deshalb
# init: false. Sonst schiebt Docker seinen eigenen Init davor und run.sh
# bekommt die Signale nicht mehr sauber.
init: false
startup: application
boot: auto

# Innen 8000 wie auf der NAS, aussen 8778 - die gewohnte Adresse bleibt.
ports:
  8000/tcp: 8778
ports_description:
  8000/tcp: Weboberflaeche des Toolkits

webui: "http://[HOST]:[PORT:8000]/"

# /gesundheit ist die einzige Route ohne Login-Zwang und damit genau das,
# was der Watchdog braucht. Antwortet sie nicht mehr, startet der Supervisor
# das Add-on neu.
watchdog: "http://[HOST]:[PORT:8000]/gesundheit"

# Alle Daten liegen unter /share/deinweg-toolkit. Das ist derselbe Ordner,
# den das Samba-Add-on im Netz freigibt: das Wiki bleibt damit sowohl im
# Browser als auch im Finder bearbeitbar - so wie bisher ueber die NAS.
map:
  - share:rw

options:
  app_name: Dein Weg Toolkit
  admin_benutzername: timo
  admin_passwort: ""
  sitzung_tage: 30
  wecker_intervall: 3600
  max_upload_mb: 20
  zeitzone: Europe/Berlin

schema:
  app_name: str
  admin_benutzername: str
  admin_passwort: str?
  sitzung_tage: int(1,365)
  wecker_intervall: int(0,86400)
  max_upload_mb: int(1,200)
  zeitzone: str
