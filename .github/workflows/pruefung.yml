# Die automatische Prüfung läuft bei jedem Push und bei jedem Pull
# Request. Bisher lief sie nur, wenn jemand sie von Hand startete - bei
# 1554 Einzelprüfungen und einem öffentlichen Repository ist das eine
# Zeile Konfiguration und ein dauerhaftes Netz.
#
# ⚠️ Bewusst dieselben Pakete wie im Dockerfile, dazu httpx für den
# TestClient. Es gibt weiterhin keine requirements.txt: die Pakete des
# Abbilds stehen im Dockerfile, und zwei Listen liefen früher oder
# später auseinander. Wer dort etwas ergänzt, ergänzt es auch hier.
name: Prüfung

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet \
            fastapi==0.115.6 \
            "uvicorn[standard]==0.34.0" \
            jinja2==3.1.5 \
            python-multipart==0.0.20 \
            openpyxl==3.1.5 \
            httpx

      - name: Prüfung ausführen
        working-directory: deinweg_toolkit
        run: python -m app.tests

      # ⚠️ Der häufigste Auslieferungsfehler überhaupt: die Nummer in
      # config.yaml bleibt stehen, und Home Assistant bietet das Update
      # nie an. Die Prüfung selbst merkt das nicht - sie vergleicht
      # VERSION nur mit dem Changelog.
      - name: Versionsnummern vergleichen
        run: |
          python - <<'PY'
          import re, pathlib
          v = re.search(r'VERSION = "([^"]+)"',
                        pathlib.Path("deinweg_toolkit/app/main.py").read_text()).group(1)
          c = re.search(r'^version: "([^"]+)"',
                        pathlib.Path("deinweg_toolkit/config.yaml").read_text(),
                        re.M).group(1)
          print(f"main.py: {v}   config.yaml: {c}")
          if v != c:
              raise SystemExit(
                  f"Die Versionsnummern gehen auseinander ({v} vs. {c}). "
                  "Ohne passende Nummer in config.yaml bietet Home Assistant "
                  "das Update nie an.")
          PY
